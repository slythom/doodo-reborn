name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go — test, vet, lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: server

  godot:
    name: Godot — import headless + parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Les .import sont ignorés (client/.gitignore) : la CI doit
        # régénérer les artefacts d'import, comme un clone frais.
      - name: Télécharger Godot 4.7.2 headless
        run: |
          curl -fsSL -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -o -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Import + parse check
        run: |
          cd client
          timeout 120 /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --import 2>&1 | tee /tmp/import.log
          if grep -qiE "SCRIPT ERROR|Parse Error" /tmp/import.log; then
            echo "::error::Erreurs de parse GDScript détectées (import)"
            exit 1
          fi
          # Run court : les autoloads (UI, Net) et les scènes ne parsent
          # qu'à l'exécution — 5 s suffisent à détecter les erreurs.
          timeout 30 /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --quit-after 5 2>&1 | tee /tmp/run.log
          if grep -qiE "SCRIPT ERROR|Parse Error" /tmp/run.log; then
            echo "::error::Erreurs de parse GDScript détectées (run)"
            exit 1
          fi
